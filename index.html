<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول الحصص</title>
<link rel="stylesheet" href="assets/style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbf6ea">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دفتري">
</head>
<body>

<header class="topbar topbar-stacked">
  <div class="topbar-top">
    <h1>الجدول</h1>
    <div class="menu-wrap">
      <button type="button" id="moreMenuBtn" class="btn btn-ghost icon-btn-round" title="المزيد من الخيارات" aria-label="المزيد من الخيارات" aria-haspopup="true">⚙️</button>
      <div id="moreMenu" class="dropdown-menu" hidden>
        <button id="exportBtn" class="btn btn-ghost" title="تنزيل نسخة احتياطية من الجدول">📤 تصدير</button>
        <button id="importBtn" class="btn btn-ghost" title="استعادة الجدول من نسخة احتياطية">📥 استيراد</button>
        <button id="exportCalendarBtn" class="btn btn-ghost" title="تنزيل ملف تقويم لاستيراده في Google Calendar">📅 تصدير إلى Google Calendar</button>
        <button id="fullBackupExportBtn" class="btn btn-ghost" title="تنزيل نسخة احتياطية شاملة: الجدول، الفصول، الحضور، والتقارير">💾 نسخة احتياطية شاملة</button>
        <button id="fullBackupImportBtn" class="btn btn-ghost" title="استعادة كل البيانات من نسخة احتياطية شاملة">📂 استعادة نسخة شاملة</button>
        <button id="forceUpdateBtn" class="btn btn-ghost" title="يُحدّث التطبيق إلى آخر إصدار دون حذف أي بيانات محفوظة">🔄 تحديث التطبيق</button>
        <button id="testNotifBtn" class="btn btn-ghost" title="جرّب شكل التنبيه قبل أن نقرر تفعيله تلقائيًا">🔔 تجربة تنبيه</button>
      </div>
    </div>
  </div>
  <div class="topbar-actions">
    <a href="students.html" class="btn btn-ghost">قوائم الفصول</a>
    <a href="attendance.html" class="btn btn-ghost">المتابعة اليومية</a>
    <a href="reports.html" class="btn btn-ghost">التقارير</a>
    <button id="addClassBtn" class="btn btn-primary">+ إضافة حصة</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <input type="file" id="fullBackupImportFile" accept="application/json" hidden>
  </div>
</header>

<main>
  <div class="week-bar">
    <div class="week-nav">
      <button id="prevWeekBtn" class="btn btn-ghost icon-btn-round" aria-label="الأسبوع السابق">▶</button>
      <span id="weekLabel" class="week-label"></span>
      <button id="nextWeekBtn" class="btn btn-ghost icon-btn-round" aria-label="الأسبوع القادم">◀</button>
    </div>
    <button id="thisWeekBtn" class="btn btn-ghost icon-btn-round" title="الرجوع لهذا الأسبوع" aria-label="الرجوع لهذا الأسبوع">📅</button>
  </div>
  <div class="schedule-wrap">
    <table id="grid" class="grid"></table>
  </div>
</main>

<!-- Class editor modal -->
<div id="classModal" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">إضافة حصة</h2>
      <button class="icon-btn" id="closeModalBtn" aria-label="إغلاق">&times;</button>
    </div>

    <form id="classForm">
      <input type="hidden" id="classId">

      <div class="form-field">المادة
        <div id="subject"></div>
      </div>

      <div class="form-field">الصف
        <div id="room"></div>
      </div>

      <div class="row">
        <div class="form-field field-day">اليوم
          <div id="day"></div>
        </div>
        <div class="form-field field-period">الحصة
          <div id="period"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="deleteBtn" class="btn btn-danger" hidden>حذف</button>
        <div class="spacer"></div>
        <button type="button" id="cancelBtn" class="btn btn-ghost">إلغاء</button>
        <button type="submit" class="btn btn-primary">حفظ</button>
      </div>
    </form>

    <div id="quickLinks" class="quick-links" hidden>
      <a id="quickLinkStudents" href="#" class="btn btn-ghost btn-small">📋 قائمة الفصل</a>
      <a id="quickLinkReports" href="#" class="btn btn-ghost btn-small">📊 تقرير الفصل</a>
    </div>

    <div id="notesSection" class="notes-section" hidden>
      <h3>ملاحظات ومهام</h3>
      <ul id="notesList" class="notes-list"></ul>
      <form id="noteForm" class="note-form">
        <input type="text" id="noteText" placeholder="أضف ملاحظة أو مهمة..." required>
        <button type="submit" class="btn btn-primary btn-small">إضافة</button>
      </form>
    </div>
  </div>
</div>

<!-- First step when tapping an empty grid cell — أساسية goes to the normal
     recurring-class form above; تغطية opens the one-off form below,
     pre-scoped to that exact cell's date/period. -->
<div id="cellTypeModal" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>نوع الحصة</h2>
      <button type="button" class="icon-btn" id="closeCellTypeModalBtn" aria-label="إغلاق">&times;</button>
    </div>
    <div class="cell-type-choices">
      <button type="button" id="cellTypeRegularBtn" class="cell-type-choice">
        <span class="cell-type-icon">📘</span>
        <span class="cell-type-label">حصة أساسية</span>
      </button>
      <button type="button" id="cellTypeCoverBtn" class="cell-type-choice">
        <span class="cell-type-icon">➕</span>
        <span class="cell-type-label">حصة تغطية</span>
      </button>
    </div>
  </div>
</div>

<!-- One-off cover session for a specific empty cell — same idea as
     "إضافة حصة لهذا اليوم" في صفحة المتابعة اليومية، لكن التاريخ والحصة
     محددين مسبقًا من الخلية اللي ضُغط عليها، فما تحتاج تختارهم من جديد. -->
<div id="coverModal" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>إضافة حصة تغطية</h2>
      <button type="button" class="icon-btn" id="closeCoverModalBtn" aria-label="إغلاق">&times;</button>
    </div>
    <form id="coverForm">
      <p class="hint-text" id="coverHintText"></p>
      <div class="form-field">المادة
        <div id="coverSubject"></div>
      </div>
      <div class="form-field">الصف
        <div id="coverRoom"></div>
      </div>
      <label class="form-field">اسم الأستاذ — اختياري
        <input type="text" id="coverTeacherInput" placeholder="مثلاً: أ. محمد العتيبي">
      </label>
      <div class="modal-footer">
        <div class="spacer"></div>
        <button type="button" id="cancelCoverBtn" class="btn btn-ghost">إلغاء</button>
        <button type="submit" class="btn btn-primary">إضافة</button>
      </div>
    </form>
  </div>
</div>

<!-- Read-only details for a temporary session (تبديل/تغطية) cell in the
     grid — created and managed from صفحة المتابعة اليومية, this just
     shows what it is before jumping there to change anything. -->
<div id="tempDetailsModal" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="tempDetailsTitle">تفاصيل الحصة</h2>
      <button class="icon-btn" id="closeTempDetailsModalBtn" aria-label="إغلاق">&times;</button>
    </div>
    <div id="tempDetailsBody"></div>
    <div class="modal-footer">
      <div class="spacer"></div>
      <a id="tempDetailsManageLink" href="#" class="btn btn-primary">فتح في المتابعة اليومية</a>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
