<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتابعة اليومية</title>
<link rel="stylesheet" href="assets/style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b7fdb">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دفتري">
</head>
<body>

<header class="topbar topbar-stacked">
  <div class="topbar-top">
    <h1>المتابعة اليومية</h1>
    <div class="menu-wrap">
      <button type="button" id="moreMenuBtn" class="btn btn-ghost icon-btn-round" title="المزيد من الخيارات" aria-label="المزيد من الخيارات" aria-haspopup="true">⚙️</button>
      <div id="moreMenu" class="dropdown-menu" hidden>
        <button id="forceUpdateBtn" class="btn btn-ghost" title="يُحدّث التطبيق إلى آخر إصدار دون حذف أي بيانات محفوظة">🔄 تحديث التطبيق</button>
      </div>
    </div>
  </div>
  <div class="topbar-actions">
    <a href="index.html" class="btn btn-ghost">الجدول</a>
    <a href="students.html" class="btn btn-ghost">قوائم الفصول</a>
    <a href="reports.html" class="btn btn-ghost">التقارير</a>
  </div>
</header>

<main>
  <div class="date-bar">
    <button id="prevDayBtn" class="btn btn-ghost icon-btn-round" aria-label="اليوم السابق">▶</button>
    <input type="date" id="datePicker">
    <button id="nextDayBtn" class="btn btn-ghost icon-btn-round" aria-label="اليوم التالي">◀</button>
    <button id="todayBtn" class="btn btn-ghost">اليوم</button>
    <span id="dayLabel" class="day-label"></span>
    <button id="holidayToggleBtn" class="btn btn-ghost" title="وضع علامة على هذا اليوم كعطلة رسمية، أو إلغاء العلامة">🗓 وضع علامة عطلة رسمية</button>
  </div>

  <div id="daySummary" class="day-summary" hidden></div>
  <div id="holidayState" class="empty-state" hidden></div>

  <div id="sessionsContainer"></div>
  <div id="noScheduleState" class="empty-state" hidden>لا توجد حصص مجدولة في هذا اليوم.</div>
</main>

<!-- Per-class tools: من الدور؟ / تقسيم مجموعات عشوائي -->
<div id="toolsModal" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="toolsModalTitle">أدوات الحصة</h2>
      <button type="button" class="icon-btn" id="closeToolsModalBtn" aria-label="إغلاق">&times;</button>
    </div>
    <div id="toolsModalBody"></div>
  </div>
</div>

<script src="assets/attendance.js"></script>
</body>
</html>
